# Local development stack: PostgreSQL, Redis, Seq and the API itself.
#   docker compose up -d --build   → API on http://localhost:8080 (/health, /docs)
#   docker compose up -d postgres redis seq   → dependencies only, then `dotnet run` the API (port 5150)
# Credentials here are for local development; production uses environment variables.
services:
  postgres:
    image: postgres:17
    container_name: ipm-postgres
    environment:
      POSTGRES_DB: ipm
      POSTGRES_USER: ipm
      POSTGRES_PASSWORD: ipm_dev
    # 55432 on the host: 5432 is often taken by a locally installed PostgreSQL.
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipm -d ipm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ipm-redis
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  seq:
    image: datalust/seq:2024.3
    container_name: ipm-seq
    environment:
      ACCEPT_EULA: "Y"
    ports: ["5341:80"]
    volumes: [seqdata:/data]

  api:
    build: .
    image: ipm-api:dev
    container_name: ipm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ipm;Username=ipm;Password=ipm_dev;Gss Encryption Mode=Disable
      ConnectionStrings__Cache: redis:6379
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      Database__MigrateOnStartup: "true"
      OpenApi__Enabled: "true"
      # Real data only: no demo users, projects or notifications (set to "true" for a demo database).
      Seed__Demo: "false"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seq: { condition: service_started }
    restart: unless-stopped

  web:
    build: ../ipm-web
    image: ipm-web:dev
    container_name: ipm-web
    environment:
      API_UPSTREAM: http://api:8080
    ports: ["8000:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  seqdata:
